# Delegador padrão do log4jdbc (mantém integração com SLF4J)
log4jdbc.spylogdelegator.name=net.sf.log4jdbc.log.slf4j.Slf4jSpyLogDelegator

# --- Mostrar SOMENTE as queries executadas e o tempo de execução ---
log4jdbc.auto.load.popular.drivers=true
log4jdbc.suppress.generated.keys=false

# Níveis de log
log4jdbc.log4jdbc.debug.stack.prefix=dao
log4jdbc.trim.sql.extraneous.whitespace=true

# Apenas estes dois mostram as queries de forma útil
# sqlonly = mostra o SQL puro
# sqltiming = mostra o SQL + tempo de execução
# para isso funcionar, os outros níveis precisam estar “desligados” via SLF4J config
