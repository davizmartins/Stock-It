<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <title>Login - StockIT</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class=" bg-light d-flex justify-content-center align-items-center vh-100">

  <div class="card p-4 shadow" style="width: 350px;">
    <h2 class="text-center mb-4">Login</h2>
    <form id="loginForm">
      <div class="mb-3">
        <label for="loginEmail" class="form-label">Email</label>
        <input type="email" id="loginEmail" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="loginSenha" class="form-label">Senha</label>
        <input type="password" id="loginSenha" class="form-control" required>
      </div>
      <button type="submit" class="btn btn-success w-100">Entrar</button>
    </form>
    <hr>
    <button class="btn btn-primary w-100" data-bs-toggle="modal" data-bs-target="#modalCadastro">Criar
      Conta</button>
  </div>

  <!-- Modal Cadastro -->
  <div class="modal fade" id="modalCadastro" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Criar Conta</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="formCadastro">
            <div class="mb-3">
              <label for="cadNome" class="form-label">Nome</label>
              <input type="text" id="cadNome" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="cadEmail" class="form-label">Email</label>
              <input type="email" id="cadEmail" class="form-control" required>
            </div>
            <div class="mb-3">
              <label for="cadSenha" class="form-label">Senha</label>
              <input type="password" id="cadSenha" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100">Cadastrar</button>
          </form>
        </div>
      </div>
    </div>
  </div>



  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="../../assets/js/login.js"></script>
</body>

</html>
